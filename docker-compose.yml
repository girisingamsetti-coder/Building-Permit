services:
  db:
    image: postgres:16-alpine
    container_name: lams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lams
      POSTGRES_PASSWORD: lams
      POSTGRES_DB: lams
    ports:
      # 5433 on the host: 5432 is taken by the adjacent land allotment
      # project's Postgres. Inside the compose network the port is still 5432.
      - '5433:5432'
    volumes:
      - lams-db-data:/var/lib/postgresql/data
    healthcheck:
      # The app and worker wait on this rather than racing the database.
      test: ['CMD-SHELL', 'pg_isready -U lams -d lams']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lams-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lams:lams@db:5432/lams?schema=public
      DIRECT_URL: postgresql://lams:lams@db:5432/lams?schema=public
      APP_URL: http://localhost:3000
      # Compose-local values. A real deployment supplies these from its secret
      # store — see .env.example and the production guardrails in env.ts.
      AUTH_SECRET: ${AUTH_SECRET:-compose-local-secret-at-least-32-characters-long}
      CRON_SECRET: ${CRON_SECRET:-compose-local-cron-secret}
      # Compose runs with NODE_ENV=production, so the guardrails apply: local
      # storage and mock scrutiny must be accepted explicitly.
      STORAGE_PROVIDER: s3
      S3_BUCKET: lams-local
      SCRUTINY_PROVIDER: mock
      ALLOW_MOCK_SCRUTINY_IN_PRODUCTION: 'true'
      DEMO_MODE: 'false'
      WORKER_ENABLED: 'false'
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: lams-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lams:lams@db:5432/lams?schema=public
      DIRECT_URL: postgresql://lams:lams@db:5432/lams?schema=public
      APP_URL: http://app:3000
      AUTH_SECRET: ${AUTH_SECRET:-compose-local-secret-at-least-32-characters-long}
      CRON_SECRET: ${CRON_SECRET:-compose-local-cron-secret}
      STORAGE_PROVIDER: s3
      S3_BUCKET: lams-local
      SCRUTINY_PROVIDER: mock
      ALLOW_MOCK_SCRUTINY_IN_PRODUCTION: 'true'
      DEMO_MODE: 'false'
      WORKER_ENABLED: 'true'

volumes:
  lams-db-data:
